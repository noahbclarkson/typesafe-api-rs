[package]
name = "typesafe-api"
description = "Ergonomic, strongly typed Rust client for the TypeSafe System One API (Jev)"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "typesafe_api"

[features]
default = ["rustls-tls"]
# TLS backends, mirroring reqwest so downstreams can pick one.
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
# Synchronous client built on reqwest::blocking.
blocking = ["reqwest/blocking"]
# #[derive(Evaluation)] / #[derive(Options)] / #[derive(Levels)].
derive = ["dep:typesafe-api-macros"]
# Bounded-concurrency helpers for fanning out over many states.
stream = ["dep:futures-util"]
# Preserve authored key order in every nested JSON object.
preserve-order = ["serde_json/preserve_order"]

[dependencies]
typesafe-api-macros = { workspace = true, optional = true }

backon.workspace = true
futures-util = { workspace = true, optional = true }
indexmap.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
insta.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trybuild.workspace = true
wiremock.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "triage"

[[example]]
name = "typed_triage"
required-features = ["derive"]

[[example]]
name = "fan_out"
required-features = ["derive", "stream"]

[[example]]
name = "blocking_triage"
required-features = ["blocking"]

[[example]]
name = "list_models"
