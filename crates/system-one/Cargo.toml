[package]
name = "system-one"
description = "Ergonomic, strongly typed Rust client for the TypeSafe System One API (Jev)"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "system_one"

[features]
default = ["rustls-tls"]
# TLS backends, mirroring reqwest so downstreams can pick one.
rustls-tls = []
native-tls = []
# Synchronous client built on reqwest::blocking.
blocking = []
# #[derive(Evaluation)] / #[derive(Options)] / #[derive(Levels)].
derive = []
# Bounded-concurrency helpers for fan-out over many states.
stream = []
# Preserve authored key order in every nested JSON object.
preserve-order = ["serde_json/preserve_order"]

[dependencies]
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
