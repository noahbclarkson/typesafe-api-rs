[workspace]
members = ["crates/typesafe-api", "crates/typesafe-api-macros"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noahbclarkson/typesafe-api-rs"
homepage = "https://github.com/noahbclarkson/typesafe-api-rs"
authors = ["typesafe-api contributors"]
keywords = ["typesafe", "jev", "classification", "llm", "sdk"]
categories = ["api-bindings", "asynchronous"]

[workspace.dependencies]
typesafe-api-macros = { version = "0.1.0", path = "crates/typesafe-api-macros" }

backon = { version = "1.6", default-features = false, features = ["std", "std-blocking-sleep", "tokio-sleep"] }
darling = "0.24"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
heck = "0.5"
indexmap = { version = "2.14", features = ["serde"] }
proc-macro2 = "1.0.95"
quote = "1.0.40"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "charset", "http2", "system-proxy"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.6", features = ["full", "extra-traits"] }
thiserror = "2.0.20"
tokio = { version = "1.45", default-features = false, features = ["time"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }

insta = { version = "1.48", features = ["json"] }
tokio-test = "0.4.4"
trybuild = "1.0.104"
wiremock = "0.6.5"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
