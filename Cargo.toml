[workspace]
members = ["crates/system-one"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/system-one-rs"
homepage = "https://github.com/OWNER/system-one-rs"
authors = ["system-one-rs contributors"]
keywords = ["typesafe", "jev", "classification", "llm", "sdk"]
categories = ["api-bindings", "asynchronous"]

[workspace.dependencies]
indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
