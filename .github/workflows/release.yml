name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    steps:
      # The `secrets` context is not available in a job-level `if`, so the
      # check happens here. Until CARGO_REGISTRY_TOKEN exists this job is a
      # no-op rather than a red cross on every push to main.
      - name: Check for a registry token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN is not set, so releases are paused. Add the secret to enable publishing."
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: steps.token.outputs.present == 'true'
      - name: Open a release PR, or publish when one merges
        if: steps.token.outputs.present == 'true'
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
