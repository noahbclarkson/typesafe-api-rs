name: Bug report
description: Something behaves differently from what the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a request failed against the live API, include the request id from
        `error.request_id()`. It is the fastest route to a cause.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest program that shows it. Redact your API key.
      render: rust
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Crate version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
    validations:
      required: true

  - type: input
    id: features
    attributes:
      label: Enabled features
      placeholder: "default, blocking"

  - type: input
    id: request-id
    attributes:
      label: Request id
      description: From `error.request_id()`, if the failure came from the API.
